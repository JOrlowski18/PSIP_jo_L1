services:
  postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    environment:
      POSTGRES_USER: psip
      POSTGRES_PASSWORD: psip
      POSTGRES_DB: psip
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    environment:
      PGPASSWORD: psip
    volumes:
      - ./app:/app:ro
      - ./data:/data:ro
    command: ["tail", "-f", "/dev/null"]

volumes:
  pgdata: